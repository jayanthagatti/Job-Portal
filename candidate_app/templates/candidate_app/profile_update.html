<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Profile</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }
    body { min-height:100vh; background:linear-gradient(135deg,#87ceeb,#b0e0e6); display:flex; justify-content:center; align-items:center; padding:40px 20px; }
    .glass-form { width:440px; padding:35px; background:rgba(255,255,255,0.35); backdrop-filter:blur(16px); border-radius:20px; border:1px solid rgba(255,255,255,0.5); box-shadow:0 12px 30px rgba(0,0,0,0.15); animation:fadeSlide 0.9s ease; }
    .glass-form h1 { text-align:center; margin-bottom:25px; color:#1f3c4d; font-weight:500; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .glass-form input, .glass-form textarea { width:100%; padding:12px; margin-bottom:14px; border-radius:8px; border:1px solid rgba(31,60,77,0.3); background:rgba(255,255,255,0.6); font-size:14px; color:#1f3c4d; transition:0.3s ease; resize:none; }
    .glass-form textarea { min-height:80px; }
    .glass-form input[type="file"] { padding:8px; cursor:pointer; }
    .glass-form input::placeholder, .glass-form textarea::placeholder { color:rgba(31,60,77,0.6); }
    .glass-form input:focus, .glass-form textarea:focus { outline:none; background:rgba(255,255,255,0.8); box-shadow:0 0 10px rgba(31,60,77,0.2); }
    .field-label { font-size:12px; font-weight:600; color:#1f3c4d; opacity:0.7; margin-bottom:4px; display:block; }
    .field-group { margin-bottom:4px; }
    .file-hint { font-size:11px; color:#1f3c4d; opacity:0.6; margin-top:-10px; margin-bottom:12px; }
    .btn-row { display:flex; gap:10px; margin-top:8px; }
    .glass-form button { flex:1; padding:13px; border:none; border-radius:8px; background:rgba(31,140,190,0.85); color:#fff; font-size:15px; cursor:pointer; transition:0.3s ease; }
    .glass-form button:hover { background:rgba(31,140,190,1); transform:translateY(-2px); }
    .btn-cancel { flex:1; padding:13px; border-radius:8px; background:rgba(255,255,255,0.4); color:#1f3c4d; font-size:15px; text-align:center; text-decoration:none; border:1px solid rgba(31,60,77,0.2); transition:0.3s ease; }
    .btn-cancel:hover { background:rgba(255,255,255,0.7); }
    @keyframes fadeSlide { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
  </style>
</head>
<body>
  <form class="glass-form" action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h1>Update Profile</h1>

    <div class="field-group">
      <label class="field-label">Bio</label>
      <textarea name="bio" placeholder="Tell us about yourself..." required>{{ existing.bio|default:'' }}</textarea>
    </div>

    <div class="field-group">
      <label class="field-label">Address</label>
      <textarea name="address" placeholder="Street address" required>{{ existing.address|default:'' }}</textarea>
    </div>

    <div class="form-row">
      <div>
        <label class="field-label">City</label>
        <input type="text" name="city" placeholder="City" value="{{ existing.city|default:'' }}" required>
      </div>
      <div>
        <label class="field-label">State</label>
        <input type="text" name="state" placeholder="State" value="{{ existing.state|default:'' }}" required>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label class="field-label">Pincode</label>
        <input type="text" name="pincode" placeholder="Pincode" value="{{ existing.pincode|default:'' }}">
      </div>
      <div>
        <label class="field-label">Country</label>
        <input type="text" name="country" placeholder="Country" value="{{ existing.country|default:'' }}">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Profile Picture</label>
      <input type="file" name="image" accept="image/*">
      {% if existing.profile_pic %}<p class="file-hint">Current: {{ existing.profile_pic.name }} (upload new to replace)</p>{% endif %}
    </div>

    <div class="field-group">
      <label class="field-label">Resume (PDF only)</label>
      <input type="file" name="resume" accept=".pdf">
      {% if existing.resume %}<p class="file-hint">Current: {{ existing.resume.name }} (upload new to replace)</p>{% endif %}
    </div>

    <div class="btn-row">
      <a href="{% url 'candidate_profile' %}" class="btn-cancel">Cancel</a>
      <button type="submit">Save Changes</button>
    </div>
  </form>
</body>
</html>
